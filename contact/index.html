<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20fill%3D%22%23060606%22/%3E%3Crect%20x%3D%2222%22%20y%3D%2219%22%20width%3D%225%22%20height%3D%2226%22%20fill%3D%22%23F2F1EE%22/%3E%3Crect%20x%3D%2237%22%20y%3D%2219%22%20width%3D%225%22%20height%3D%2226%22%20fill%3D%22%23F2F1EE%22/%3E%3C/svg%3E">
<title>이메일 문의 | Pause on the Way</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Playfair+Display:wght@400&family=Noto+Serif+KR:wght@200;300;400&family=Noto+Sans+KR:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#060606;--ink:#F2F1EE;--mut:rgba(242,241,238,.62);--line:rgba(242,241,238,.2);--kr:"Noto Serif KR","Nanum Myeongjo",serif;--sans:"Inter","Noto Sans KR",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.9;letter-spacing:.012em;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100svh}
a{color:inherit;text-decoration:none}
header{display:flex;justify-content:space-between;align-items:center;height:68px;padding:0 28px;border-bottom:1px solid rgba(255,255,255,.08)}
.wm{font-family:"Playfair Display",serif;font-size:20px;white-space:nowrap}
header a.back{font-size:12.5px;letter-spacing:.2em;opacity:.78}
header a.back:hover{opacity:1}
main{max-width:640px;margin:0 auto;padding:clamp(72px,10vw,128px) 28px clamp(72px,10vw,128px)}
.eyebrow{font-size:11.5px;letter-spacing:.34em;text-transform:uppercase;color:rgba(242,241,238,.5);margin:0 0 26px}
h1{font-family:"Cormorant Garamond","Noto Serif KR",serif;font-weight:300;font-size:clamp(27px,3.8vw,44px);line-height:1.6;letter-spacing:.02em;margin:0}
.lead{margin-top:22px;color:var(--mut)}
form{margin-top:56px;display:grid;gap:30px}
label{display:block;font-size:13px;letter-spacing:.08em;color:var(--mut)}
input,textarea{width:100%;margin-top:8px;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;color:var(--ink);font:inherit;font-size:16px;padding:10px 0;outline:none;transition:border-color .25s}
textarea{min-height:140px;resize:vertical;line-height:1.8}
input:focus,textarea:focus{border-bottom-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 36px;border:0;background:#F2F1EE;color:#060606;font:inherit;font-size:13px;letter-spacing:.16em;cursor:pointer;transition:background .25s}
.btn:hover{background:#fff}
.st{font-size:14px;margin:-6px 0 0;min-height:1.4em}.st.ok{color:#F2F1EE}.st.err{color:#E8A5A0}
.note{font-size:13px;color:rgba(242,241,238,.5);margin-top:-6px}
.alt{margin-top:48px;padding-top:28px;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}
.alt a{text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-LQP3VZB2V0"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag("js", new Date());
  gtag("config", "G-LQP3VZB2V0");
</script>
</head>
<body>
<header>
  <a class="wm" href="../">Pause on the Way</a>
  <a class="back" href="../">돌아가기</a>
</header>
<main>
  <p class="eyebrow">Contact</p>
  <h1>이메일로 문의하기</h1>
  <p class="lead">궁금하신 점을 남겨 주시면 확인 후 순서대로 답변드립니다. 상담 내용은 이 문의에 적지 않으셔도 괜찮습니다.</p>
  <form id="f">
    <label>이름<input name="name" autocomplete="name" required></label>
    <label>회신받을 연락처 (이메일 또는 전화)<input name="reply" autocomplete="email" required></label>
    <label>문의 내용<textarea name="msg" required></textarea></label>
    <input type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    <p class="st" id="st" role="status" aria-live="polite"></p>
    <div><button class="btn" type="submit">보내기</button></div>
  </form>
  <p class="alt">급하신 경우 <a href="tel:07080804224">전화</a> 또는 <a href="sms:07080804224">문자</a>로 문의해 주세요.</p>
</main>
<script>
var ENDPOINT = "https://formsubmit.co/ajax/da6a8d5556503e8b9aa8c4af68017380";
var form = document.getElementById("f"),
    btn = form.querySelector("button[type=submit]"),
    st = document.getElementById("st");
form.addEventListener("submit", function (e) {
  e.preventDefault();
  if (form.elements["_honey"].value) return;
  var d = new FormData(form);
  btn.disabled = true; btn.textContent = "보내는 중…"; st.textContent = ""; st.className = "st";
  fetch(ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify({
      "이름": d.get("name"),
      "회신 연락처": d.get("reply"),
      "문의 내용": d.get("msg"),
      "_subject": "[Pause on the Way] 이메일 문의",
      "_template": "table",
      "_captcha": "false"
    })
  }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok && j.success !== "false" && j.success !== false, j: j }; }); })
    .then(function (res) {
      if (!res.ok) throw new Error("fail");
      try { (window.dataLayer = window.dataLayer || []).push({ event: "email_submit" }); } catch (_) {}
      form.reset(); btn.textContent = "보내기";
      st.className = "st ok"; st.textContent = "문의가 접수되었습니다. 남겨 주신 연락처로 답변드리겠습니다.";
    })
    .catch(function () {
      btn.disabled = false; btn.textContent = "보내기";
      st.className = "st err"; st.textContent = "전송에 실패했습니다. 잠시 후 다시 시도하시거나 전화·문자로 문의해 주세요.";
    })
    .then(function () { btn.disabled = false; });
});
</script>
<script>
try { history.scrollRestoration = "manual"; } catch (e) {}
function toTop(){ window.scrollTo(0,0); document.documentElement.scrollTop=0; document.body.scrollTop=0; }
toTop();
window.addEventListener("load", toTop);
window.addEventListener("pageshow", toTop);
</script>
</body>
</html>
